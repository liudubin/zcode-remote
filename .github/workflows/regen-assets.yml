name: Regen generated assets

# 图标与注入包的「物化」工作流：make_icon.py / _patch_web2.py / build_bundle.py
# 的产物（PNG、ZCodeBundle.js、WebActivity.kt 嵌入段）由 runner 生成后回推仓库，
# 避免二进制走手搬通道；生成物仅进仓库供浏览/直接构建，CI 构建本身总是先重生成。

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'ios/tools/make_icon.py'
      - 'ios/tools/_patch_v81.py'
      - 'dev/bundle/**'
      - '.github/workflows/regen-assets.yml'

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Regenerate icons + rebuild bundle
        run: |
          python3 ios/tools/make_icon.py
          python3 ios/tools/_patch_v81.py
          python3 _patch_web2.py
          python3 _validate.py
          python3 ios/tools/build_bundle.py

      - name: Commit regenerated files
        run: |
          git config user.name "zcode-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: regenerate icons + bundle from source"
            git push
          fi
