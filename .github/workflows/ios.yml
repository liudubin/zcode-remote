name: Build iOS

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: 构建成功后发布到 GitHub Releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild embedded bundle + validate
        # 与 Android CI 同款：先重拼注入包再全套校验（XML/Kotlin/JS 语法/资源引用），
        # iOS 的 ZCodeBundle.js 由 build_bundle.py 从同一源生成，保证两端注入包不漂移
        run: |
          python3 _patch_web2.py
          python3 _validate.py
          python3 ios/tools/build_bundle.py

      - name: Install xcodegen & ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned, device arm64)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project ZCodeRemote.xcodeproj -scheme ZCodeRemote \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tail -60

      - name: Fake-sign & package IPA
        run: |
          APP=ios/.build/Build/Products/Release-iphoneos/ZCodeRemote.app
          ldid -S "$APP/ZCodeRemote"
          rm -rf pkg dist && mkdir -p pkg/Payload dist
          cp -R "$APP" pkg/Payload/
          (cd pkg && zip -qry "../dist/ZCodeRemote-0.0.2-ios${{ github.run_number }}-unsigned.ipa" Payload)

      - name: Package roothide deb
        run: |
          python3 ios/tools/make_deb.py \
            ios/.build/Build/Products/Release-iphoneos/ZCodeRemote.app \
            dist --version "0.0.2-ios${{ github.run_number }}"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCodeRemote-ios
          path: |
            dist/*.ipa
            dist/*.deb
          retention-days: 30

  # 模拟器冒烟：-zcodeURL 直进会话页，截图验证 WKWebView 真实渲染（扫码白屏类问题回归）
  smoke:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild bundle + generate project
        run: |
          python3 ios/tools/build_bundle.py
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          cd ios
          xcodebuild -project ZCodeRemote.xcodeproj -scheme ZCodeRemote \
            -configuration Debug -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -20

      - name: Launch with -zcodeURL and screenshot
        run: |
          xcrun simctl boot "$UDID" || true
          sleep 20   # 等 springboard 起来
          xcrun simctl install "$UDID" ios/.build/Build/Products/Debug-iphonesimulator/ZCodeRemote.app
          launch_retry() {  # 新 runner 上首启偶发 IXUserPresentableError，重试兜底
            for i in 1 2 3 4 5; do
              if xcrun simctl launch "$UDID" "$@"; then return 0; fi
              sleep 5
            done
            return 1
          }
          # 入口页（重设计布局回归）
          launch_retry com.zcode.remote
          sleep 6
          xcrun simctl io "$UDID" screenshot smoke-entry.png
          xcrun simctl terminate "$UDID" com.zcode.remote || true
          # 会话页直进
          launch_retry com.zcode.remote -zcodeURL "https://zcode.z.ai/remote/ci-smoke-test"
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke-early.png
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke-late.png

      - name: Collect app log
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 5m \
            --predicate 'subsystem == "com.zcode.remote"' > smoke-log.txt 2>&1 || true
          tail -50 smoke-log.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZCodeRemote-ios-smoke
          path: |
            smoke-*.png
            smoke-log.txt
          retention-days: 30

  # 发布：release=true 手动触发时，自动生成更新日志小节 → 构建产物 → GitHub Release
  release:
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ZCodeRemote-ios
          path: dist

      - name: Auto-append changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(ls dist/*.deb | sed -E 's/.*remote_([0-9a-z.\-]+)_iphoneos.*/\1/')
          # 已手写本版小节则跳过（ios/CHANGELOG 顶节版本==本次）
          TOP=$(awk '/^## /{print $2; exit}' ios/CHANGELOG.md)
          if [ "$TOP" = "$VER" ]; then
            echo "changelog already has $VER (hand-written), skip"
            exit 0
          fi
          # 上一 release tag 之后的提交首行 → 新小节
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -1)
          RANGE="${PREV:+$PREV..}HEAD"
          {
            echo "## $VER"
            echo
            git log "$RANGE" --no-merges --format='- %s' -- \
              ios/ dev/bundle/ .github/workflows/ios.yml |
              grep -vE '^- (docs|style|chore|ci):' | head -20
          } > section.md
          # 若无实质变更（空列表），至少记录版本行
          if ! grep -q '^- ' section.md; then
            echo "- 例行构建发布" >> section.md
          fi
          # ① ios/CHANGELOG.md：顶部（# 更新日志 之后）
          awk -v sec="$(cat section.md)" '
            /^# 更新日志/ && !done { print; print ""; print sec; done=1; next }
            { print }' ios/CHANGELOG.md > CHANGELOG.new && mv CHANGELOG.new ios/CHANGELOG.md
          # ② 根 CHANGELOG.md：[未发布] 节之前（Keep a Changelog 格式，iOS 小节带日期）
          DATE=$(date +%Y-%m-%d)
          {
            echo "## [v$VER · iOS] — $DATE"
            echo
            tail -n +3 section.md
            echo
          } > root-section.md
          if ! grep -qF "v$VER · iOS" CHANGELOG.md; then
            awk -v sec="$(cat root-section.md)" '
              /^## \[未发布\]/ && !done { print sec; done=1; print; next }
              { print }' CHANGELOG.md > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md
          fi
          head -8 ios/CHANGELOG.md
          echo "---- root ----"
          head -8 CHANGELOG.md
          git config user.name "zcode-remote-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ios/CHANGELOG.md CHANGELOG.md
          git commit -q -m "docs: 更新日志自动生成 $VER [skip ci]" || true
          git push origin main

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(ls dist/*.deb | sed -E 's/.*remote_([0-9a-z.\-]+)_iphoneos.*/\1/')
          echo "version=$VER"
          awk '/^## /{n++; if(n==2) exit} n==1{print}' ios/CHANGELOG.md > release-notes.md
          {
            head -100 release-notes.md
            echo
            echo "## 产物"
            echo "- \`ZCodeRemote-$VER-unsigned.ipa\` — 未签名 IPA（ldid 假签），TrollStore/越狱设备直装"
            echo "- \`com.zcode.remote_${VER}_iphoneos-arm64e.deb\` — roothide scheme deb（Relaxin/RootHide），Sileo 直接安装或 dpkg -i，覆盖升级"
          } > notes.md
          gh release create "v$VER" dist/* \
            --title "ZCodeRemote iOS v$VER" \
            --notes-file notes.md --latest || true
          gh release upload "v$VER" dist/* --clobber
