name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild embedded bundle + validate
        # 与 Android CI 同款：先重拼注入包再全套校验（XML/Kotlin/JS 语法/资源引用），
        # iOS 的 ZCodeBundle.js 由 build_bundle.py 从同一源生成，保证两端注入包不漂移
        run: |
          python3 _patch_web2.py
          python3 _validate.py
          python3 ios/tools/build_bundle.py

      - name: Install xcodegen & ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (unsigned, device arm64)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project ZCodeRemote.xcodeproj -scheme ZCodeRemote \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tail -60

      - name: Fake-sign & package IPA
        run: |
          APP=ios/.build/Build/Products/Release-iphoneos/ZCodeRemote.app
          ldid -S "$APP/ZCodeRemote"
          rm -rf pkg dist && mkdir -p pkg/Payload dist
          cp -R "$APP" pkg/Payload/
          (cd pkg && zip -qry "../dist/ZCodeRemote-0.0.2-ios${{ github.run_number }}-unsigned.ipa" Payload)

      - name: Package roothide deb
        run: |
          python3 ios/tools/make_deb.py \
            ios/.build/Build/Products/Release-iphoneos/ZCodeRemote.app \
            dist --version "0.0.2-ios${{ github.run_number }}"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCodeRemote-ios
          path: |
            dist/*.ipa
            dist/*.deb
          retention-days: 30

  # 模拟器冒烟：-zcodeURL 直进会话页，截图验证 WKWebView 真实渲染（扫码白屏类问题回归）
  smoke:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild bundle + generate project
        run: |
          python3 ios/tools/build_bundle.py
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          cd ios
          xcodebuild -project ZCodeRemote.xcodeproj -scheme ZCodeRemote \
            -configuration Debug -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -20

      - name: Launch with -zcodeURL and screenshot
        run: |
          xcrun simctl boot "$UDID" || true
          sleep 20   # 等 springboard 起来
          xcrun simctl install "$UDID" ios/.build/Build/Products/Debug-iphonesimulator/ZCodeRemote.app
          # 入口页（重设计布局回归）
          xcrun simctl launch "$UDID" com.zcode.remote
          sleep 6
          xcrun simctl io "$UDID" screenshot smoke-entry.png
          xcrun simctl terminate "$UDID" com.zcode.remote || true
          # 会话页直进
          xcrun simctl launch "$UDID" com.zcode.remote -zcodeURL "https://zcode.z.ai/remote/ci-smoke-test"
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke-early.png
          sleep 15
          xcrun simctl io "$UDID" screenshot smoke-late.png

      - name: Collect app log
        if: always()
        run: |
          xcrun simctl spawn "$UDID" log show --last 5m \
            --predicate 'subsystem == "com.zcode.remote"' > smoke-log.txt 2>&1 || true
          tail -50 smoke-log.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZCodeRemote-ios-smoke
          path: |
            smoke-*.png
            smoke-log.txt
          retention-days: 30
